databaseChangeLog:
  - changeSet:
      id: 014-integration-signing-secret
      author: freezehub
      changes:
        # Per-integration HMAC secret for webhook deliveries (FZ-048).
        #
        # Stored recoverable, unlike an API key hash: signing requires the secret
        # itself, so there is nothing to compare a hash against. That is exactly
        # what OI-4 (credentials at rest) is about, and this makes it sharper.
        #
        # Nullable, because only WEBHOOK integrations have one — and because any
        # webhook created before this changeset has none until it is rotated.
        - addColumn:
            tableName: integration
            columns:
              - column:
                  name: signing_secret
                  type: varchar(255)
