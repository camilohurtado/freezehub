services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: freezehub
      POSTGRES_USER: freezehub
      POSTGRES_PASSWORD: freezehub
    ports:
      - "5432:5432"
    volumes:
      - freezehub-postgres-data:/var/lib/postgresql/data

  # Development only: catches outgoing email so email delivery (FZ-042) can be exercised
  # without sending anything real. Behind a compose profile so a plain
  # `docker compose up -d postgres` is unaffected; start it with
  # `docker compose --profile dev up -d mailpit`.
  # A deployed environment points spring.mail.* at SES instead.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI at http://localhost:8025

volumes:
  freezehub-postgres-data:
