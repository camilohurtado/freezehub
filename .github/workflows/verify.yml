# Everything that can be checked without an AWS account (FZ-064).
#
# Four jobs rather than one, so a frontend lint failure does not hide a backend test
# failure — the point of CI is finding every problem in one run, not the first one.
name: Verify

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes anything.
permissions:
  contents: read

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs the integration tests, which start a real PostgreSQL through
      # Testcontainers. GitHub-hosted runners have a working Docker daemon, so this needs
      # no service container — the tests bring their own database and run Liquibase
      # against it, which is what makes the migrations part of what CI checks.
      - name: Build and test
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is the difference worth catching
      # here rather than on somebody's laptop.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      # Type errors only surface here: `tsc -b` runs as part of the build, not the tests.
      - name: Build
        working-directory: frontend
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      # `-backend=false` is what makes this need no AWS credentials at all: it installs
      # providers and checks the configuration without touching state or the account.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate the state bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deployment gate customers copy. A syntax error here breaks their pipeline,
      # not ours, so it is worth a job of its own however small.
      - name: Check the deployment gate parses
        run: sh -n examples/freeze-check.sh

      - name: Check it is executable
        run: test -x examples/freeze-check.sh
