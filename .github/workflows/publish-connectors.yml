# Publish the connector image (FZ-099).
#
# One artifact. The image is the connector: every CI system in connectors/README.md
# reaches FreezeHub by running it, so publishing this one thing is what makes all of them
# usable (D-26). There is no second repository, no mirror and no sync — the source stays
# here, private, and only the image goes out.
#
# NOTHING HERE HAS BEEN EXECUTED. Two prerequisites, both deliberate human decisions:
#
#   1. A GitHub organization `freezehubio`. The image is named for it because a personal
#      username in a customer's deploy pipeline undercuts a product sold to companies,
#      and renaming later breaks every pipeline using it.
#
#   2. A secret CONNECTOR_PUBLISH_TOKEN with `packages: write` on that organization.
#      GITHUB_TOKEN cannot write to another owner's package namespace.
#
# The package's visibility is set on the package itself, independently of this
# repository — which is what lets a public image ship from a private source tree. It must
# be set to public once, after the first push, or customers get "denied" on pull.
#
# Manual rather than on-tag: publishing changes what runs inside customers' pipelines,
# the same reasoning that makes deploy.yml manual.
name: Publish connector image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish, e.g. v1.0.0 (v1 is moved to match)'
        required: true
      publish:
        description: 'Actually push. Leave false to build and test without publishing.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-connector-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A version that is not vN.N.N becomes a Docker tag nobody can predict. Cheaper to
      # refuse here than to unpublish.
      - name: Check the version looks like a version
        run: |
          case "${{ inputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.0.0, got '${{ inputs.version }}'" >&2; exit 1 ;;
          esac

      # Publishing something that fails its own tests breaks customer pipelines rather
      # than ours, so the suite runs here too and not only on push.
      - name: Test the connectors
        run: |
          node connectors/test/run-tests.js
          node connectors/test/check-connectors.js

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CONNECTOR_PUBLISH_TOKEN }}

      # Both architectures: CI runners are mostly amd64, self-hosted and Apple hardware
      # are arm64, and a gate a developer cannot run on their laptop is one they cannot
      # debug. No `latest` tag — a moving `latest` in a deploy gate is how a pipeline
      # changes behaviour on a day nobody touched it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: connectors
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/freezehubio/freeze-check:${{ inputs.version }}
            ghcr.io/freezehubio/freeze-check:v1

      - name: Say what happened
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Pushed ghcr.io/freezehubio/freeze-check:${{ inputs.version }} and moved v1."
            echo "If this was the first push, set the package to PUBLIC or customers get 'denied'."
          else
            echo "Dry run: built ${{ inputs.version }}, pushed nothing."
          fi
