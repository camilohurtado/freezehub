# Publish the connector image (FZ-099).
#
# One artifact. The image is the connector: every CI system in connectors/README.md
# reaches FreezeHub by running it, so publishing this one thing is what makes all of them
# usable (D-26). There is no second repository, no mirror and no sync.
#
# One prerequisite, and it is already met: the GitHub organization `freezehubio`. The
# image is named for it because a personal username in a customer's deploy pipeline
# undercuts a product sold to companies, and renaming later breaks every pipeline using
# it.
#
# There was a second — a CONNECTOR_PUBLISH_TOKEN with `packages: write` — and moving the
# repository into the organization removed it. GITHUB_TOKEN could not write to another
# owner's package namespace, and `freezehubio` is no longer another owner. The built-in
# token is minted per run and expires with the job, so this is a better credential than
# the personal access token it replaces, not merely a cheaper one.
#
# The package's visibility is set on the package itself, independently of this repository,
# and a newly published package is private. It must be set to public once, after the first
# push, or customers get "denied" on pull.
#
# Manual rather than on-tag: publishing changes what runs inside customers' pipelines,
# the same reasoning that makes deploy.yml manual.
name: Publish connector image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish, e.g. v1.0.0 (v1 is moved to match)'
        required: true
      publish:
        description: 'Actually push. Leave false to build and test without publishing.'
        type: boolean
        default: false

permissions:
  contents: read
  # Publishing to ghcr.io/freezehubio needs this, and the repository now lives in that
  # organization, so GITHUB_TOKEN carries it. Nothing else in this workflow writes.
  packages: write

concurrency:
  group: publish-connector-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A version that is not vN.N.N becomes a Docker tag nobody can predict. Cheaper to
      # refuse here than to unpublish.
      - name: Check the version looks like a version
        run: |
          case "${{ inputs.version }}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v1.0.0, got '${{ inputs.version }}'" >&2; exit 1 ;;
          esac

      # Publishing something that fails its own tests breaks customer pipelines rather
      # than ours, so the suite runs here too and not only on push.
      - name: Test the connectors
        run: |
          node connectors/test/run-tests.js
          node connectors/test/check-connectors.js

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures: CI runners are mostly amd64, self-hosted and Apple hardware
      # are arm64, and a gate a developer cannot run on their laptop is one they cannot
      # debug. No `latest` tag — a moving `latest` in a deploy gate is how a pipeline
      # changes behaviour on a day nobody touched it.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: connectors
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/freezehubio/freeze-check:${{ inputs.version }}
            ghcr.io/freezehubio/freeze-check:v1

      - name: Say what happened
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "Pushed ghcr.io/freezehubio/freeze-check:${{ inputs.version }} and moved v1."
            echo "If this was the first push, set the package to PUBLIC or customers get 'denied'."
          else
            echo "Dry run: built ${{ inputs.version }}, pushed nothing."
          fi
