# Findings that are known, dated, and owned — not waved away (`FZ-127`, `OI-24`).
#
# **The list is empty, and that is the whole story of this file.**
#
#   FZ-127  39 entries   the Java tree on Spring Boot 3.3.4
#   FZ-136   8 entries   upgraded to 4.1.1; the Java entries were dead
#   FZ-139   0 entries   base images pinned by digest and moved off the one shipping
#                        /usr/bin/pebble, so the last eight are gone rather than suppressed
#
# It stays, emptied, rather than being deleted with its four `trivyignores:` lines in
# `verify.yml`. Re-adding a suppression should be one block in a file that already explains
# what a suppression costs — not a new file plus four workflow edits, three of which
# somebody will forget.
#
# `expiredAt` is the point of the format. An entry stops being suppressed on its date and
# the build starts failing on it, so the list cannot quietly become permanent — which is
# how a scanner turns into decoration. Anything added here needs one, and an owner.
#
# Regenerate from a scan rather than editing by hand:
#   docker run --rm -v "$PWD/backend":/scan -v "$HOME/.m2":/root/.m2 \
#     aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --format json /scan
vulnerabilities: []
