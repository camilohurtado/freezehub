# Findings that are known, dated, and owned — not waved away (FZ-127, OI-24).
#
# Every entry here is a HIGH or CRITICAL in the backend's dependency tree as it stands on
# `master` today, with the application pinned to Spring Boot 3.3.4. The scanner fails the
# build on anything that is *not* in this list, which is what makes it worth having from
# the day it is switched on rather than after a platform upgrade.
#
# `expiredAt` is the point of the file. On that date these stop being suppressed and the
# build starts failing on them, so the list cannot quietly become permanent — which is how
# a scanner turns into decoration.
#
# **Owner: `FZ-136`.** The upgrade is measured, not hoped for: Spring Boot 3.5.14 builds
# and passes all 468 tests unchanged, and takes this list from 39 findings to 21. The
# remaining ones need a newer patch line still. None of that is guesswork — it was run.
#
# Regenerate after an upgrade rather than editing by hand:
#   docker run --rm -v "$PWD/backend":/scan -v "$HOME/.m2":/root/.m2 \
#     aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --format json /scan
